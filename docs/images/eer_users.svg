<text text-anchor="start" x="539.15" y="-423.5" font-family="Arial" font-size="9.00">Double line = total participation</text>
<text text-anchor="start" x="539.15" y="-412.7" font-family="Arial" font-size="9.00">(every VEHICLE has an owner, every STATION an operator,</text>
<text text-anchor="start" x="539.15" y="-401.9" font-family="Arial" font-size="9.00"> every BOOKING a user, every ALERT a recipient).</text>
<text text-anchor="start" x="539.15" y="-391.1" font-family="Arial" font-size="9.00">Subclasses add no attributes, so single&#45;table mapping</text>
<text text-anchor="start" x="539.15" y="-380.3" font-family="Arial" font-size="9.00">(users.role) avoids three 1:1 joins; the rule the FK alone</text>
<text text-anchor="start" x="539.15" y="-369.5" font-family="Arial" font-size="9.00">cannot express (OPERATES only for OPERATOR/ADMIN) is</text>
<text text-anchor="start" x="539.15" y="-358.7" font-family="Arial" font-size="9.00">enforced by trg_stations_operator_role_before_insert/update.</text>
